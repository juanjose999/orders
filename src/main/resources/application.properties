spring.application.name=orders


# Railway (y otros PaaS) indican el puerto en la variable PORT
server.port=${PORT:8080}

# Base de datos (definir como variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/orders
spring.datasource.username=${DB-USER}
spring.datasource.password=${DB-PASSWORD}

# JPA
# "update" conserva los datos entre reinicios; usar DDL_AUTO=create-drop solo para pruebas locales
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT: secreto en Base64 de al menos 256 bits (p. ej. `openssl rand -base64 32`)
jwt.secret=${JWT-SECRET}
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d

# Rate limit (token bucket en memoria, por instancia)
# /auth/**: por IP. Resto de la API: por usuario autenticado o por IP.
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.auth.capacity=10
rate-limit.auth.period=1m
rate-limit.api.capacity=120
rate-limit.api.period=1m

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}